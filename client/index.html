<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker - POC Minimal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      background: #fdf6e2;
      color: #3b2f2f;
      margin: 0;
      padding: 40px 20px;
    }
    .game-card {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .cookie-btn {
      font-size: 80px;
      background: none;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
      margin: 20px 0;
    }
    .cookie-btn:active {
      transform: scale(0.92);
    }
    .counter {
      font-size: 2.2rem;
      font-weight: bold;
      color: #b45309;
    }
    .cps-badge {
      font-size: 0.95rem;
      color: #78350f;
      background: #fef3c7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 6px;
    }
    .status-box {
      margin-top: 25px;
      padding: 10px;
      font-size: 0.85rem;
      background: #f3f4f6;
      border-radius: 8px;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="game-card">
    <h1>🍪 Cookie Clicker POC</h1>
    <div class="counter" id="cookie-count">0</div>
    <div class="cps-badge">Production : <span id="cps-rate">0</span> / sec</div>

    <div>
      <button class="cookie-btn" id="click-btn" title="Cliquer pour produire un cookie">🍪</button>
    </div>

    <div style="margin-top: 20px; text-align: left; background: #fdfaf3; padding: 15px; border-radius: 12px; border: 1px solid #fed7aa;">
      <h3 style="margin: 0 0 10px 0; font-size: 1.1rem; color: #9a3412;">🏪 Boutique (POC)</h3>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div>
          <strong>👆 Curseur</strong> (+1 cookie/sec)<br>
          <small style="color: #78350f;">Possédés : <span id="cursor-count">0</span> | Prix : <span id="cursor-cost">15</span></small>
        </div>
        <button id="buy-cursor" style="padding: 6px 14px; border-radius: 8px; border: none; background: #ea580c; color: white; cursor: pointer; font-weight: bold;">Acheter</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <strong>👵 Grand-mère</strong> (+5 cookies/sec)<br>
          <small style="color: #78350f;">Possédées : <span id="grandma-count">0</span> | Prix : <span id="grandma-cost">100</span></small>
        </div>
        <button id="buy-grandma" style="padding: 6px 14px; border-radius: 8px; border: none; background: #ea580c; color: white; cursor: pointer; font-weight: bold;">Acheter</button>
      </div>
    </div>

    <div class="status-box" id="sync-status">
      🟢 Prêt - En attente de synchronisation avec le serveur...
    </div>
  </div>

  <script>
    let cookies = 0;
    let cps = 0;
    let cursors = 0;
    let cursorCost = 15;
    let grandmas = 0;
    let grandmaCost = 100;

    const cookieDisplay = document.getElementById('cookie-count');
    const cpsDisplay = document.getElementById('cps-rate');
    const syncStatus = document.getElementById('sync-status');
    const clickBtn = document.getElementById('click-btn');

    const buyCursorBtn = document.getElementById('buy-cursor');
    const cursorCountEl = document.getElementById('cursor-count');
    const cursorCostEl = document.getElementById('cursor-cost');

    const buyGrandmaBtn = document.getElementById('buy-grandma');
    const grandmaCountEl = document.getElementById('grandma-count');
    const grandmaCostEl = document.getElementById('grandma-cost');

    // Clic manuel
    clickBtn.addEventListener('click', () => {
      cookies += 1;
      updateDisplay();
    });

    // Achat Curseur
    buyCursorBtn.addEventListener('click', () => {
      if (cookies >= cursorCost) {
        cookies -= cursorCost;
        cursors += 1;
        cursorCost = Math.round(cursorCost * 1.15);
        recalcCps();
        updateDisplay();
      }
    });

    // Achat Grand-mère
    buyGrandmaBtn.addEventListener('click', () => {
      if (cookies >= grandmaCost) {
        cookies -= grandmaCost;
        grandmas += 1;
        grandmaCost = Math.round(grandmaCost * 1.15);
        recalcCps();
        updateDisplay();
      }
    });

    function recalcCps() {
      cps = (cursors * 1) + (grandmas * 5);
      cpsDisplay.textContent = cps.toLocaleString();
    }

    function updateDisplay() {
      cookieDisplay.textContent = Math.floor(cookies).toLocaleString();
      cursorCountEl.textContent = cursors;
      cursorCostEl.textContent = cursorCost;
      grandmaCountEl.textContent = grandmas;
      grandmaCostEl.textContent = grandmaCost;

      // Boutons actifs / désactivés selon le solde
      buyCursorBtn.style.opacity = cookies >= cursorCost ? '1' : '0.5';
      buyCursorBtn.disabled = cookies < cursorCost;
      buyGrandmaBtn.style.opacity = cookies >= grandmaCost ? '1' : '0.5';
      buyGrandmaBtn.disabled = cookies < grandmaCost;
    }

    // Boucle de production automatique (mise à jour fluide 10x par seconde)
    setInterval(() => {
      if (cps > 0) {
        cookies += cps / 10;
        updateDisplay();
      }
    }, 100);

    // Synchronisation périodique avec le serveur (Backend POC)
    async function syncWithServer() {
      try {
        const response = await fetch('http://localhost:3001/api/game/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cookiesClaimed: Math.floor(cookies),
            cookiesPerSecond: cps,
            clientTimestamp: Date.now()
          })
        });

        if (response.ok) {
          syncStatus.textContent = `🟢 Synchronisé avec le serveur (${new Date().toLocaleTimeString()})`;
          syncStatus.style.color = '#15803d';
        } else {
          syncStatus.textContent = `⚠️ Alerte de synchronisation serveur (HTTP ${response.status})`;
          syncStatus.style.color = '#b91c1c';
        }
      } catch (err) {
        syncStatus.textContent = `⚪ Mode hors-ligne (serveur local non détecté sur :3001)`;
        syncStatus.style.color = '#6b7280';
      }
    }

    // Sync toutes les 10 secondes
    setInterval(syncWithServer, 10000);
    updateDisplay();
  </script>
</body>
</html>
