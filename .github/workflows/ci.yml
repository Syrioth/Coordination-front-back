name: CI/CD Pipeline — Cookie Clicker Web

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Coupe les droits d'écriture du token GitHub Actions par défaut
permissions:
  contents: read

jobs:
  docs-check:
    name: Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core documentation files
        run: |
          for file in README.md CONTRIBUTING.md ONBOARDING.md PERSONAS.md STORYMAP.md ERROR_MANAGEMENT.md; do
            test -f "$file" || (echo "Missing required doc: $file" && exit 1)
          done
          echo "All core documentation files present."

  server-ci:
    name: Back-End Lint & Unit/API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Lint server
        working-directory: server
        run: npm run lint
      - name: Run server unit & API tests
        working-directory: server
        run: npm test

  client-ci:
    name: Front-End Lint, Unit Tests, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Run client unit tests
        working-directory: client
        run: npm test
      - name: Build client (Vite)
        working-directory: client
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Playwright)
        working-directory: client
        run: npm run test:e2e
